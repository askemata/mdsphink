<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Askemata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Roboto+Slab:wght@400;700&family=Roboto+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* ============================================================
   TEMA: réplica do Read the Docs / Sphinx (sphinx_rtd_theme)
   CONTEÚDO real fica em content/*.md, listado em content/index.json.
   Este HTML não precisa ser editado para trocar textos.
   ============================================================ */
:root{
  --sidebar-bg:#343131;
  --sidebar-bg-alt:#2c2c2c;
  --sidebar-hover:#4e4a4a;
  --sidebar-text:#c9c9c9;
  --sidebar-text-dim:#8fa3b3;
  --accent-blue:#2980B9;
  --text:#404040;
  --text-light:#767676;
  --border:#e1e4e5;
  --code-bg:#f8f8f8;
  --note-bg:#e7f2fa;
  --note-border:#6ab0de;
  --warn-bg:#ffedcc;
  --warn-border:#f0b37e;
  --tip-bg:#e6f9e6;
  --tip-border:#3aa53a;
  --sidebar-w:300px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Lato",-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  font-size:16px;
  line-height:1.6;
  background:#fff;
}

/* ---------- Sidebar ---------- */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
  background:var(--sidebar-bg);
  overflow-y:auto;
  z-index:20;
  display:flex; flex-direction:column;
}
.sidebar-header{
  padding:1.2rem 1.4rem 1rem;
  background:var(--sidebar-bg-alt);
  border-bottom:1px solid #1c1c1c;
}
.sidebar-header a{
  color:#fff; text-decoration:none; font-weight:700; font-size:1.35rem;
  font-family:"Roboto Slab",serif;
  display:flex; align-items:center; gap:.5rem;
}
.sidebar-header .version{
  display:block; margin-top:.3rem; color:var(--sidebar-text-dim); font-size:.8rem;
}
.search-box{ padding:.9rem 1.2rem; }
.search-box input{
  width:100%; padding:.5rem .7rem; border:none; border-radius:2px;
  background:#fff; color:#333; font-size:.85rem; font-family:inherit;
}
.search-box input:focus{ outline:2px solid var(--accent-blue); }

.nav-tree{ flex:1; padding-bottom:2rem; }
.nav-caption{
  color:#55a5d9; text-transform:uppercase; font-size:.75rem; font-weight:700;
  letter-spacing:.04em; padding:1rem 1.4rem .4rem; margin:0;
}
.nav-tree ul{ list-style:none; margin:0; padding:0; }
.nav-tree a{
  display:block; color:var(--sidebar-text); text-decoration:none;
  padding:.45rem 1.4rem; font-size:.92rem; border-bottom:1px solid rgba(255,255,255,.03);
}
.nav-tree .nav-l2 a{ padding-left:2.2rem; font-size:.87rem; }
.nav-tree a:hover{ background:var(--sidebar-hover); color:#fff; }
.nav-tree a.current{
  background:#fcfcfc; color:#404040; font-weight:700;
  border-left:3px solid var(--accent-blue);
}
.nav-tree li.hidden, .nav-group.hidden{ display:none; }

/* ---------- Layout / Content ---------- */
.content-wrap{ margin-left:var(--sidebar-w); min-height:100vh; }
.breadcrumbs-row{
  background:#fcfcfc; border-bottom:1px solid var(--border);
  padding:.7rem 3rem; display:flex; align-items:center; justify-content:space-between; gap:1rem;
}
.breadcrumbs{ font-size:.85rem; color:var(--text-light); }
.breadcrumbs a{ color:var(--accent-blue); text-decoration:none; }
.breadcrumbs a:hover{ text-decoration:underline; }
.print-btn{
  flex:0 0 auto; background:#fff; border:1px solid var(--border); color:var(--text);
  font-family:"Lato",sans-serif; font-size:.8rem; font-weight:700; letter-spacing:.01em;
  padding:.4rem .8rem; border-radius:3px; cursor:pointer; white-space:nowrap;
}
.print-btn:hover{ background:var(--accent-blue); color:#fff; border-color:var(--accent-blue); }

.document{ max-width:800px; padding:2.2rem 3rem 4rem; }
.document h1{
  font-family:"Roboto Slab",serif; font-size:2rem; font-weight:700;
  border-bottom:1px solid var(--border); padding-bottom:.5rem; margin-top:0;
}
.document h2{
  font-family:"Roboto Slab",serif; font-size:1.5rem; font-weight:700;
  margin-top:2.2rem; border-bottom:1px solid var(--border); padding-bottom:.3rem;
}
.document h3{ font-size:1.2rem; font-weight:700; margin-top:1.6rem; }
.document p{ margin:0 0 1rem; }
.document a{ color:var(--accent-blue); text-decoration:none; }
.document a:hover{ text-decoration:underline; }

.document code{
  background:var(--code-bg); border:1px solid var(--border); border-radius:2px;
  padding:.1rem .35rem; font-family:"Roboto Mono",monospace; font-size:.85em; color:#e74c3c;
}
.document pre{
  background:var(--code-bg); border:1px solid var(--border); border-left:3px solid var(--accent-blue);
  border-radius:2px; padding:1rem 1.2rem; overflow-x:auto; margin:0 0 1.2rem;
}
.document pre code{ background:none; border:none; padding:0; color:#404040; }

.document blockquote{
  margin:0 0 1.2rem; padding:.1rem 1.2rem; border-left:4px solid var(--border); color:var(--text-light);
}
.document table{ border-collapse:collapse; width:100%; margin:0 0 1.4rem; font-size:.92rem; }
.document th, .document td{ border:1px solid var(--border); padding:.5rem .8rem; text-align:left; }
.document th{ background:#f3f6f6; font-weight:700; }
.document ul, .document ol{ margin:0 0 1.1rem; padding-left:1.6rem; }
.document li{ margin-bottom:.3rem; }
.document hr{ border:none; border-top:1px solid var(--border); margin:2rem 0; }
.document img{ max-width:100%; }

.admonition{
  margin:0 0 1.3rem; border-radius:2px; overflow:hidden; border:1px solid var(--note-border);
}
.admonition-title{
  font-weight:700; padding:.5rem 1rem; color:#fff; font-size:.92rem;
}
.admonition p{ padding:0 1rem; margin:.8rem 0; }
.admonition.note{ border-color:var(--note-border); background:var(--note-bg); }
.admonition.note .admonition-title{ background:var(--note-border); }
.admonition.warning{ border-color:var(--warn-border); background:var(--warn-bg); }
.admonition.warning .admonition-title{ background:var(--warn-border); }
.admonition.tip{ border-color:var(--tip-border); background:var(--tip-bg); }
.admonition.tip .admonition-title{ background:var(--tip-border); }

.doc-footer{
  border-top:1px solid var(--border); margin-top:2.5rem; padding-top:1.2rem;
  display:flex; justify-content:space-between; font-size:.88rem;
}
.doc-footer a{ color:var(--accent-blue); text-decoration:none; }
.doc-footer a:hover{ text-decoration:underline; }
.doc-footer .prev::before{ content:"« "; }
.doc-footer .next::after{ content:" »"; }
.rtd-footer{
  text-align:center; color:var(--text-light); font-size:.8rem; padding:1.5rem 3rem 2.5rem;
}
.print-link-row{ text-align:center; margin-top:1.8rem; }

.state-msg{ padding:2rem 3rem; color:var(--text-light); }
.state-msg.error{ color:#c0392b; }

/* ============================================================
   MODO DE IMPRESSÃO — folha A4, duas colunas, tipografia acadêmica
   inspirada em LaTeX (article class + booktabs). Só entra em ação
   ao imprimir / "Salvar como PDF"; a tela não é afetada.
   ============================================================ */
.print-meta{ display:none; }
.academic-header{ display:none; }

@media print{
  @page{
    size: A4;
    margin: 18mm 14mm 20mm;
  }
  html, body{ background:#fff; }
  .no-print,
  .sidebar, .mobile-bar, .rtd-footer, .print-btn,
  .doc-footer{ display:none !important; }

  .content-wrap{ margin-left:0; }
  .document{
    max-width:none;
    padding:0;
    margin:0;
    font-family:"STIX Two Text", "Cambria", Georgia, serif;
    font-size:10.3pt;
    line-height:1.5;
    color:#111;
    column-count:2;
    column-gap:9mm;
    column-rule:.5pt solid #999;
    text-align:justify;
    hyphens:auto;
    -webkit-hyphens:auto;
    counter-reset: section;
  }

  /* Cabeçalho de página: assinatura + data, atravessando as 2 colunas */
  .print-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    column-span:all;
    border-bottom:.8pt solid #111;
    padding-bottom:5pt; margin-bottom:16pt;
    font-family:"STIX Two Text", serif;
    font-variant:small-caps;
    letter-spacing:.04em;
    font-size:9pt;
    color:#333;
  }

  /* Título do documento: atravessa as colunas, centralizado, sem numeração */
  .document h1{
    column-span:all;
    text-align:center;
    font-family:"STIX Two Text", serif;
    font-weight:700;
    font-size:19pt;
    line-height:1.25;
    border-bottom:none;
    margin:0 0 6pt;
    padding:0;
    break-after:avoid;
  }

  /* Cabeçalho acadêmico: autor, afiliação, resumo e palavras-chave — vem do
     front matter YAML do .md. Atravessa as 2 colunas, como o preâmbulo de um
     artigo em LaTeX (\author, \affiliation, \begin{abstract}). */
  .academic-header{
    display:block;
    column-span:all;
    margin:0 0 16pt;
  }
  .academic-author{
    text-align:center;
    font-size:11pt;
    font-family:"STIX Two Text", serif;
    margin:0 0 2pt;
  }
  .academic-affiliation{
    text-align:center;
    font-style:italic;
    font-size:9pt;
    color:#444;
    margin:0 0 12pt;
  }
  .academic-abstract{
    max-width:120mm;
    margin:0 auto 8pt;
    font-size:8.7pt;
    line-height:1.45;
    text-align:justify;
    hyphens:auto;
    padding-top:8pt;
    border-top:.5pt solid #999;
  }
  .academic-abstract-label{
    font-variant:small-caps;
    font-weight:700;
    margin-right:.3em;
  }
  .academic-keywords{
    max-width:120mm;
    margin:0 auto;
    font-size:8.7pt;
    text-align:justify;
    padding-bottom:8pt;
    border-bottom:.5pt solid #999;
  }

  /* Seções numeradas: 1. Título */
  .document h2{
    counter-increment: section;
    counter-reset: subsection;
    font-family:"STIX Two Text", serif;
    font-weight:700;
    font-size:12pt;
    border-bottom:none;
    margin:14pt 0 6pt;
    padding:0;
    break-after:avoid;
    break-inside:avoid;
  }
  .document h2::before{
    content: counter(section) ".\0000a0\0000a0";
  }

  /* Subseções numeradas: 1.1 Título */
  .document h3{
    counter-increment: subsection;
    font-family:"STIX Two Text", serif;
    font-style:italic;
    font-weight:600;
    font-size:10.8pt;
    margin:10pt 0 4pt;
    break-after:avoid;
    break-inside:avoid;
  }
  .document h3::before{
    content: counter(section) "." counter(subsection) "\0000a0\0000a0";
    font-style:normal;
  }

  /* Parágrafos: recuo de primeira linha ao estilo LaTeX, sem espaço entre eles */
  .document p{
    margin:0;
    text-indent:1.2em;
    orphans:3; widows:3;
  }
  .document h1 + p, .document h2 + p, .document h3 + p,
  .print-meta + h1 + p, .academic-header + p{
    text-indent:0;
  }

  .document a{ color:#111; text-decoration:none; border-bottom:.5pt solid #999; }

  .document code{
    font-family:"Courier Prime", "Courier New", monospace;
    font-size:.82em;
    background:none; border:none; padding:0; color:#111;
  }
  .document pre{
    font-family:"Courier Prime", "Courier New", monospace;
    font-size:8.3pt;
    line-height:1.35;
    background:#f7f7f7;
    border:.5pt solid #999;
    border-left:.5pt solid #999;
    border-radius:0;
    padding:7pt 8pt;
    break-inside:avoid;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .document pre code{ color:#111; }

  .document blockquote{
    font-style:italic;
    border-left:1pt solid #111;
    margin:8pt 0; padding:0 0 0 10pt;
    color:#222;
    break-inside:avoid;
  }

  /* Tabelas estilo booktabs: só linhas horizontais, sem grade */
  .document table{
    font-size:9pt;
    margin:8pt 0 10pt;
    break-inside:avoid;
  }
  .document th, .document td{
    border:none;
    border-bottom:.5pt solid #ccc;
    padding:.3rem .5rem;
  }
  .document thead th{
    background:none;
    font-weight:700;
    border-top:1pt solid #111;
    border-bottom:.8pt solid #111;
  }
  .document tbody tr:last-child td{
    border-bottom:1pt solid #111;
  }

  .document ul, .document ol{ margin:0 0 8pt; padding-left:1.3em; text-align:left; }
  .document li{ margin-bottom:.15em; }
  .document hr{ border-top:.5pt solid #999; margin:10pt 0; }
  .document img{ max-width:100%; }

  /* Admonitions: caixas discretas em tons de cinza, sem cor de tela */
  .admonition{
    border:.5pt solid #111 !important; border-radius:0;
    background:none !important;
    margin:8pt 0; break-inside:avoid;
  }
  .admonition-title{
    background:none !important; color:#111 !important;
    font-family:"STIX Two Text", serif;
    font-variant:small-caps; font-weight:700; font-size:9pt;
    padding:5pt 8pt 0;
  }
  .admonition p{ padding:4pt 8pt 6pt; text-indent:0; }
}

/* Mobile toggle */
.mobile-bar{ display:none; }
@media (max-width: 860px){
  .sidebar{ transform:translateX(-100%); transition:transform .2s ease; }
  .sidebar.open{ transform:translateX(0); }
  .content-wrap{ margin-left:0; }
  .document{ padding:1.5rem 1.2rem 3rem; }
  .breadcrumbs-row{ padding:.7rem 1.2rem; flex-wrap:wrap; }
  .mobile-bar{
    display:flex; align-items:center; gap:.8rem; background:var(--sidebar-bg); color:#fff;
    padding:.8rem 1.2rem; position:sticky; top:0; z-index:10;
  }
  .mobile-bar button{
    background:none; border:1px solid #666; color:#fff; border-radius:3px; padding:.3rem .6rem; font-size:1rem;
  }
}
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="#inicio">Askemata</a>
    <span class="version">v1.0.0</span>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar docs...">
  </div>
  <div class="nav-tree" id="navTree">
    <p class="state-msg">Carregando índice…</p>
  </div>
</nav>

<div class="content-wrap">
  <div class="mobile-bar">
    <button id="menuToggle">☰</button>
    <strong>Askemata</strong>
  </div>
  <div class="breadcrumbs-row no-print">
    <div class="breadcrumbs" id="breadcrumbs"></div>
  </div>
  <article class="document" id="content">
    <p class="state-msg">Carregando…</p>
  </article>
  <div class="rtd-footer">Gerado com um tema estilo Sphinx / Read the Docs — conteúdo real em <code>content/*.md</code>.</div>
</div>

<script>
/* ============================================================
   Motor da wiki.
   Estrutura de conteúdo esperada:
     content/index.json   -> [{ id, title, section, file }, ...]
     content/<file>.md    -> corpo em Markdown de cada página

   Para adicionar/editar páginas:
     1. Crie ou edite o .md dentro de content/
     2. Registre (ou ajuste) a entrada correspondente em content/index.json
   Nada neste HTML precisa ser tocado para isso.
   ============================================================ */
marked.setOptions({ breaks:false, gfm:true });

let PAGES = [];
const mdCache = new Map(); // id -> markdown já buscado

// admonitions :::note ... ::: -> divs
function renderAdmonitions(md){
  return md.replace(/:::(note|warning|tip)\n([\s\S]*?):::/g, (_, kind, body) => {
    const labels = { note:"Nota", warning:"Atenção", tip:"Dica" };
    return `<div class="admonition ${kind}"><p class="admonition-title">${labels[kind]}</p>${marked.parse(body.trim())}</div>`;
  });
}

async function loadIndex(){
  const res = await fetch("content/index.json");
  if(!res.ok) throw new Error("Não foi possível carregar content/index.json (HTTP " + res.status + ")");
  PAGES = await res.json();
}

async function loadPageMarkdown(page){
  if(mdCache.has(page.id)) return mdCache.get(page.id);
  const res = await fetch("content/" + page.file);
  if(!res.ok) throw new Error("Não foi possível carregar content/" + page.file + " (HTTP " + res.status + ")");
  const md = await res.text();
  mdCache.set(page.id, md);
  return md;
}

// Parser mínimo de front matter YAML — cobre o essencial (chave: valor, listas
// em bloco "- item" e listas inline "[a, b, c]"). Não é um parser YAML completo
// de propósito: os metadados de uma página de wiki não precisam de mais que isso,
// e evita puxar uma biblioteca inteira só pra ler 5 campos.
function parseFrontMatter(raw){
  const match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
  if(!match) return { meta: {}, body: raw };
  const yamlBlock = match[1];
  const body = raw.slice(match[0].length);
  const meta = {};
  let currentKey = null;
  yamlBlock.split("\n").forEach(line=>{
    const listItem = line.match(/^\s*-\s+(.*)$/);
    if(listItem && currentKey){
      if(!Array.isArray(meta[currentKey])) meta[currentKey] = [];
      meta[currentKey].push(listItem[1].trim().replace(/^["']|["']$/g, ""));
      return;
    }
    const kv = line.match(/^([A-Za-zÀ-ÿ0-9_-]+):\s*(.*)$/);
    if(kv){
      const key = kv[1].trim();
      let value = kv[2].trim();
      currentKey = key;
      if(value === ""){ meta[key] = []; return; } // lista em bloco vem nas próximas linhas
      if(/^\[.*\]$/.test(value)){
        meta[key] = value.slice(1, -1).split(",").map(s => s.trim().replace(/^["']|["']$/g, "")).filter(Boolean);
      } else {
        meta[key] = value.replace(/^["']|["']$/g, "");
      }
    }
  });
  return { meta, body };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function buildSidebar(){
  const nav = document.getElementById("navTree");
  nav.innerHTML = "";
  let currentSection = undefined; // nunca é igual a page.section na 1ª volta
  let group = null, ul = null;

  PAGES.forEach(page => {
    const sec = page.section || "__none__";
    if(sec !== currentSection || !group){
      currentSection = sec;
      group = document.createElement("div");
      group.className = "nav-group";
      if(page.section){
        const cap = document.createElement("p");
        cap.className = "nav-caption";
        cap.textContent = page.section;
        group.appendChild(cap);
      }
      ul = document.createElement("ul");
      group.appendChild(ul);
      nav.appendChild(group);
    }
    const li = document.createElement("li");
    if(page.section) li.className = "nav-l2";
    const a = document.createElement("a");
    a.href = "#" + page.id;
    a.textContent = page.title;
    a.dataset.id = page.id;
    li.appendChild(a);
    ul.appendChild(li);
  });
}

async function renderPage(id){
  const idx = PAGES.findIndex(p => p.id === id);
  const page = idx >= 0 ? PAGES[idx] : PAGES[0];
  if(!page) return;

  document.querySelectorAll(".nav-tree a").forEach(a=>{
    a.classList.toggle("current", a.dataset.id === page.id);
  });

  const crumbParts = ['<a href="#' + PAGES[0].id + '">Docs</a>'];
  if(page.section) crumbParts.push(page.section);
  crumbParts.push(page.title);
  document.getElementById("breadcrumbs").innerHTML = crumbParts.join(" &raquo; ");

  const content = document.getElementById("content");
  content.innerHTML = '<p class="state-msg">Carregando…</p>';

  let md;
  try{
    md = await loadPageMarkdown(page);
  }catch(err){
    content.innerHTML = '<p class="state-msg error">Erro ao carregar esta página: ' + err.message + '</p>';
    return;
  }
  const fm = parseFrontMatter(md);

  const html = marked.parse(renderAdmonitions(fm.body));
  content.innerHTML = html;

  const meta = document.createElement("div");
  meta.className = "print-meta";
  const kicker = page.section ? (page.section + " · Askemata") : "Askemata";
  const today = new Date().toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" });
  meta.innerHTML = "<span>" + kicker + "</span><span>" + today + "</span>";
  content.prepend(meta);

  // Cabeçalho acadêmico (só aparece na versão impressa) — vem do front matter YAML
  // do próprio arquivo .md: autor, instituicao, email, resumo, palavras-chave.
  const fmData = fm.meta;
  const hasAcademicData = fmData.autor || fmData.instituicao || fmData.email || fmData.resumo || fmData["palavras-chave"];
  if(hasAcademicData){
    const academic = document.createElement("div");
    academic.className = "academic-header";
    let inner = "";
    if(fmData.autor) inner += `<p class="academic-author">${escapeHtml(fmData.autor)}</p>`;
    const affiliation = [fmData.instituicao, fmData.email].filter(Boolean).map(escapeHtml).join(" · ");
    if(affiliation) inner += `<p class="academic-affiliation">${affiliation}</p>`;
    if(fmData.resumo) inner += `<div class="academic-abstract"><span class="academic-abstract-label">Resumo.</span> ${escapeHtml(fmData.resumo)}</div>`;
    const kw = fmData["palavras-chave"];
    if(kw){
      const kwText = Array.isArray(kw) ? kw.join(", ") : kw;
      inner += `<p class="academic-keywords"><em>Palavras-chave:</em> ${escapeHtml(kwText)}</p>`;
    }
    academic.innerHTML = inner;
    const h1 = content.querySelector("h1");
    if(h1) h1.insertAdjacentElement("afterend", academic);
    else content.prepend(academic);
  }

  const prev = PAGES[idx-1];
  const next = PAGES[idx+1];
  const footer = document.createElement("div");
  footer.className = "doc-footer";
  footer.innerHTML =
    (prev ? `<a class="prev" href="#${prev.id}">${prev.title}</a>` : "<span></span>") +
    (next ? `<a class="next" href="#${next.id}">${next.title}</a>` : "<span></span>");
  content.appendChild(footer);

  const printRow = document.createElement("div");
  printRow.className = "print-link-row no-print";
  printRow.innerHTML = '<button class="print-btn" title="Abre o diálogo de impressão do navegador — escolha \'Salvar como PDF\' para gerar um PDF">🖨️ Versão para impressão (A4, 2 colunas)</button>';
  content.appendChild(printRow);

  document.title = page.title + " — Askemata";
  window.scrollTo(0,0);
  document.getElementById("sidebar").classList.remove("open");
}

function route(){
  const id = location.hash.replace("#","") || (PAGES[0] && PAGES[0].id);
  if(id) renderPage(id);
}

// Remove acentos e caixa para comparação de busca (assim "instalacao" acha "Instalação")
function normalizeSearch(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

// A busca por título é instantânea. Para buscar dentro do CONTEÚDO das páginas
// também, precisamos ter todos os .md em mãos — isso só é buscado sob demanda,
// na primeira vez que a pessoa usa a busca (não no carregamento inicial da wiki).
let allContentLoaded = false;
let allContentPromise = null;
function ensureAllContentLoaded(){
  if(allContentLoaded) return Promise.resolve();
  if(!allContentPromise){
    allContentPromise = Promise.all(
      PAGES.map(p => loadPageMarkdown(p).catch(()=>"")) // uma página com erro não deve travar a busca nas demais
    ).then(()=>{ allContentLoaded = true; });
  }
  return allContentPromise;
}

function applySearchFilter(rawQuery){
  const q = normalizeSearch(rawQuery.trim());
  document.querySelectorAll(".nav-tree li").forEach(li=>{
    const a = li.querySelector("a");
    const body = a ? (mdCache.get(a.dataset.id) || "") : "";
    const haystack = normalizeSearch(li.textContent + " " + body);
    const match = q.length === 0 || haystack.includes(q);
    li.classList.toggle("hidden", !match);
  });
  document.querySelectorAll(".nav-group").forEach(group=>{
    const anyVisible = group.querySelector("li:not(.hidden)");
    group.classList.toggle("hidden", !anyVisible);
  });
}

document.getElementById("searchInput").addEventListener("input", (e)=>{
  const value = e.target.value;
  applySearchFilter(value); // resultado imediato com o que já estiver em cache
  ensureAllContentLoaded().then(()=>{
    // só reaplica se o campo ainda tiver o mesmo texto (pessoa não continuou digitando)
    if(document.getElementById("searchInput").value === value) applySearchFilter(value);
  });
});
document.getElementById("searchInput").addEventListener("focus", ensureAllContentLoaded);

document.getElementById("menuToggle").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

// Fecha o menu mobile ao clicar em QUALQUER link da sidebar (título ou itens do
// menu), mesmo que a página de destino seja a mesma atual (nesse caso o hash
// não muda, então "hashchange" nunca dispara e renderPage() não roda).
document.getElementById("sidebar").addEventListener("click", (e)=>{
  if(e.target.tagName === "A"){
    document.getElementById("sidebar").classList.remove("open");
  }
});

// Delegação: o botão de impressão é recriado a cada renderPage(), então o
// listener fica no #content (que nunca é substituído, só seu conteúdo).
document.getElementById("content").addEventListener("click", (e)=>{
  if(e.target.closest(".print-btn")) window.print();
});

(async function init(){
  try{
    await loadIndex();
    buildSidebar();
    window.addEventListener("hashchange", route);
    route();
  }catch(err){
    document.getElementById("navTree").innerHTML = '<p class="state-msg error">Erro: ' + err.message + '</p>';
    document.getElementById("content").innerHTML =
      '<p class="state-msg error">Erro ao carregar a página: ' + err.message + '</p>' +
      '<p class="state-msg">Se estiver testando localmente pelo <code>file://</code> (abrindo o HTML direto no navegador), ' +
      'use um servidor HTTP (ex: <code>python -m http.server</code>) ou publique via GitHub Pages — ' +
      '<code>fetch()</code> não funciona em arquivos abertos direto do disco.</p>';
  }
})();
</script>
